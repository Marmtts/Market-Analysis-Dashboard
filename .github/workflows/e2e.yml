name: E2E Tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nocny health-check niezależny od PR-ów
  workflow_dispatch: {} # ręczne odpalenie z zakładki Actions na żądanie

# Nowy push na ten sam PR/branch anuluje poprzedni, wciąż trwający bieg -
# bez tego kilka commitów z rzędu kolejkowało kilka równoległych,
# w większości już nieaktualnych przebiegów.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Najmniejsze możliwe uprawnienia domyślnego GITHUB_TOKEN dla całego
# workflow - pojedyncze joby podnoszą je punktowo tam, gdzie faktycznie
# potrzebują (patrz "checks: write" w "test" niżej).
permissions:
  contents: read

jobs:
  # Pierwszy w kolejce (test/report mają na nim "needs") - nie ma sensu
  # płacić czasem/zasobami za instalację Playwrighta i pełny przebieg
  # testów, skoro repo ma już znaną, krytyczną podatność albo wyciekły
  # sekret. Jedno narzędzie (Trivy) zamiast osobnych dla zależności
  # Pythona/Javy i sekretów - mniej kroków do utrzymania niż npm audit +
  # osobny skaner podatności Mavena + gitleaks z osobna. Projekt nie ma
  # package.json/npm - ten konkretny przykład pipeline'u (npm audit,
  # setup-node) nie pasuje do naszego stacku (Python + Java, nie Node).
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # scan-type: fs = skanuje pliki w repo (requirements.txt, e2e/pom.xml),
      # nie obraz Dockera. scanners: vuln,secret = podatności w zależnościach
      # ORAZ wyciekłe sekrety (klucze API, tokeny) w JEDNYM przebiegu. Celowo
      # skanuje tylko bieżący stan repo, nie historię gita (jak gitleaks
      # potrafi) - jeśli kiedyś okaże się, że sekret trafił do historii i
      # został później usunięty, to osobny, głębszy skan do dodania wtedy.
      - name: Scan dependencies and secrets (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Równolegle z "security" (oba szybkie, niezależne od siebie) - "test"
  # niżej czeka na OBA, żeby nie płacić za wolny Playwright, gdy już wiadomo,
  # że zawiodła szybsza, tańsza kontrola (literówka w logice scoringu wyłapana
  # tu w kilka sekund, zamiast dopiero po kilkudziesięciu sekundach Playwrighta).
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ --junitxml=reports/unit.xml

      - name: Publish test results as GitHub Check
        if: always()
        uses: dorny/test-reporter@v3.2.0
        with:
          name: Unit test results
          path: reports/unit.xml
          reporter: java-junit # parsuje standardowy schemat JUnit XML - ten sam co pytest --junitxml produkuje
          fail-on-error: true
          use-actions-summary: false

  test:
    needs: [security, unit]
    runs-on: ubuntu-latest
    # checks: write ponad domyślne (read-only) uprawnienia workflow - potrzebne
    # dorny/test-reporter niżej do opublikowania wyniku jako GitHub Check.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: e2e/pom.xml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          mvn -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          java -cp "$(cat cp.txt)" com.microsoft.playwright.CLI install --with-deps chromium

      - name: Run E2E tests (isolated instance, see e2e/run-tests.sh)
        run: bash e2e/run-tests.sh

      # Czyta ten sam surefire-reports/*.xml co krok niżej (na failu) i
      # publikuje wynik PER TEST wprost w zakładce Checks na PR-ze - bez tego
      # jedyny sposób zobaczenia, który konkretnie test padł, to przewijanie
      # logu "Run E2E tests" wyżej.
      - name: Publish test results as GitHub Check
        if: always()
        uses: dorny/test-reporter@v3.2.0
        with:
          name: E2E test results
          path: e2e/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
          # Domyślne use-actions-summary:true pisze wynik TYLKO do zakładki
          # "Summary" przebiegu, bez tworzenia osobnego Check Runu - a o to
          # właśnie chodziło (wynik per test wprost na PR, nie zagrzebany w
          # podsumowaniu). Zweryfikowane: bez tego nie powstawał żaden nowy
          # check (sprawdzone przez GitHub API check-runs na PR #5).
          use-actions-summary: false

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: e2e/target/surefire-reports

      # Surowe wyniki Allure (JSON, nie gotowy HTML) - małe, rosną liniowo z
      # liczbą testów zamiast dublować kilka MB zbundlowanego UI Allure przy
      # każdym uruchomieniu. Ten artifact to "blob" konsumowany przez job
      # "report" niżej - NIE jest sam w sobie raportem do otwarcia.
      - name: Upload Allure results (blob)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: e2e/target/allure-results
          retention-days: 14

  # Osobny job, nie krok w powyższym - buduje gotowy, klikalny raport HTML z
  # blobu wyprodukowanego przez "test". Nie potrzebuje Javy/Pythona/Playwrighta
  # (tylko Node, który jest na runnerze domyślnie), więc dzielenie środowiska
  # testowego z nim byłoby zbędnym balastem. Komunikacja między jobami idzie
  # WYŁĄCZNIE przez artifact (upload w "test" / download tutaj) - osobne joby
  # nie dzielą współdzielonego systemu plików.
  report:
    needs: test
    if: always() # raport przydaje się też (zwłaszcza) wtedy, gdy "test" padł
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Build Allure HTML report
        run: npx --yes allure-commandline generate allure-results -o allure-report --clean || true

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14
