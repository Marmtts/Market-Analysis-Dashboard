name: E2E Tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nocny health-check niezależny od PR-ów
  workflow_dispatch: {} # ręczne odpalenie z zakładki Actions na żądanie

# Nowy push na ten sam PR/branch anuluje poprzedni, wciąż trwający bieg -
# bez tego kilka commitów z rzędu kolejkowało kilka równoległych,
# w większości już nieaktualnych przebiegów.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Najmniejsze możliwe uprawnienia domyślnego GITHUB_TOKEN dla całego
# workflow - pojedyncze joby podnoszą je punktowo tam, gdzie faktycznie
# potrzebują (patrz "checks: write" w "unit"/"api"/"ui" niżej).
permissions:
  contents: read

jobs:
  # Całkiem niezależny od reszty (brak needs, nikt na nim "needs") - skanuje
  # repo równolegle ze wszystkim innym. Świadomie NIE gate'uje już "unit"/
  # "api"/"ui" (wcześniej gate'ował "test") - wynik i tak liczy się do
  # "pipeline-status" na końcu, a nie ma powodu wstrzymywać SZYBSZYCH
  # testów (unit/API) na skan, który i tak leci obok nich w tym samym czasie.
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # scan-type: fs = skanuje pliki w repo (requirements.txt, e2e/pom.xml),
      # nie obraz Dockera. scanners: vuln,secret = podatności w zależnościach
      # ORAZ wyciekłe sekrety (klucze API, tokeny) w JEDNYM przebiegu. Celowo
      # skanuje tylko bieżący stan repo, nie historię gita (jak gitleaks
      # potrafi) - jeśli kiedyś okaże się, że sekret trafił do historii i
      # został później usunięty, to osobny, głębszy skan do dodania wtedy.
      - name: Scan dependencies and secrets (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Pierwszy z testów (api/ui mają na nim "needs") - najszybszy i najtańszy,
  # więc nie ma sensu płacić za Playwrighta (instalacja Chromium, wolniejsze
  # testy UI), skoro już wiadomo, że padła podstawowa logika biznesowa.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ --junitxml=reports/unit.xml

      - name: Publish test results as GitHub Check
        if: always()
        uses: dorny/test-reporter@v3.2.0
        with:
          name: Unit test results
          path: reports/unit.xml
          reporter: java-junit # parsuje standardowy schemat JUnit XML - ten sam co pytest --junitxml produkuje
          fail-on-error: true
          use-actions-summary: false

  # Równolegle z "ui" niżej (oba czekają tylko na "unit", nie na siebie
  # nawzajem) - testy API (Playwright APIRequestContext, bez przeglądarki)
  # są dużo szybsze niż UI, więc nie ma powodu ich szeregować.
  api:
    name: API tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: e2e/pom.xml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      # Brak kroku instalacji Chromium - APIRequestContext nie uruchamia
      # przeglądarki, tylko wysyła żądania HTTP, więc testy w tym jobie
      # (klasy *ApiTest) jej nie potrzebują.
      - name: Run API tests (isolated instance, see e2e/run-tests.sh)
        run: bash e2e/run-tests.sh -Dtest=WatchlistApiTest

      - name: Publish test results as GitHub Check
        if: always()
        uses: dorny/test-reporter@v3.2.0
        with:
          name: API test results
          path: e2e/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
          use-actions-summary: false

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-api
          path: e2e/target/surefire-reports

      # Osobny "blob" per job (api/ui) - "report" niżej ściąga OBA i łączy
      # w jeden raport HTML, ten sam wzorzec co merge wielu shardów, tylko
      # źródła są dwa (api+ui), nie osiem.
      - name: Upload Allure results (blob)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: e2e/target/allure-results
          retention-days: 14

  ui:
    name: UI tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: e2e/pom.xml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          mvn -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          java -cp "$(cat cp.txt)" com.microsoft.playwright.CLI install --with-deps chromium

      - name: Run UI tests (isolated instance, see e2e/run-tests.sh)
        run: bash e2e/run-tests.sh -Dtest=SmokeTest,WatchlistTest

      - name: Publish test results as GitHub Check
        if: always()
        uses: dorny/test-reporter@v3.2.0
        with:
          name: UI test results
          path: e2e/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
          use-actions-summary: false

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-ui
          path: e2e/target/surefire-reports

      - name: Upload Allure results (blob)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: e2e/target/allure-results
          retention-days: 14

  # Czeka na OBA ("api" i "ui"), nie tylko na jeden - łączy dwa osobne bloby
  # w jeden raport HTML, więc musi mieć komplet zanim zacznie generować.
  report:
    needs: [api, ui]
    if: always() # raport przydaje się też (zwłaszcza) wtedy, gdy któryś padł
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Build Allure HTML report
        run: npx --yes allure-commandline generate allure-results -o allure-report --clean || true

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

  # Jeden zbiorczy check zamiast wymagania w branch protection każdego joba
  # z osobna - przy kilku równoległych/warunkowych jobach to jedyny sensowny
  # sposób na "czy WSZYSTKO przeszło", bez ręcznego dopisywania nowego joba
  # do listy wymaganych checków za każdym razem, gdy pipeline się rozrasta.
  pipeline-status:
    name: Pipeline status
    needs: [security, unit, api, ui, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A job finished with result: $result"; exit 1 ;;
            esac
          done
          echo "All checks passed."
