name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: e2e/pom.xml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          mvn -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          java -cp "$(cat cp.txt)" com.microsoft.playwright.CLI install --with-deps chromium

      - name: Run E2E tests (isolated instance, see e2e/run-tests.sh)
        run: bash e2e/run-tests.sh

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: e2e/target/surefire-reports
