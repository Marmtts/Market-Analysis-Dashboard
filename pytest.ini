[pytest]
# Bez tego "from src.report import ..." działa tylko gdy ktoś woła
# "python -m pytest" (co dorzuca katalog bieżący do sys.path) - gołe
# "pytest tests/" (np. tak jak woła je CI) nie ma repo root na sys.path
# i wywala ModuleNotFoundError: No module named 'src'. pythonpath=. działa
# identycznie niezależnie od tego, jak pytest jest wywołany.
pythonpath = .
