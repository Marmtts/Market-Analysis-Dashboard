# -------------------------------------------------------------
# Wagi łączenia wyniku technicznego, sentymentu i fundamentów (suma = 1)
# -------------------------------------------------------------
scoring:
  technical_weight: 0.55
  sentiment_weight: 0.30
  fundamentals_weight: 0.15
  # próg, powyżej którego spółka trafia do sekcji "warto obserwować"
  # (w dniach podwyższonego ryzyka makro zostaje automatycznie podniesiony - patrz sekcja "macro")
  suggestion_threshold: 0.55
  # jeśli technical_signal == "AT_TOP", spółka NIGDY nie trafia do sugestii kupna,
  # niezależnie od wyniku sentymentu (ochrona przed kupowaniem na górce)
  hard_block_on_top: true
  hard_block_on_sharp_decline: true  # jak hard_block_on_top, ale dla świeżych krachów

output:
  reports_dir: "reports"
  save_json: true
  save_markdown: true

# -------------------------------------------------------------
# Odkrywanie nowych spółek (LLM proponuje kandydatów spoza watchlisty)
# -------------------------------------------------------------
discovery:
  enabled: true                # wymaga włączonego llm.enabled - bez LLM ta funkcja nic nie zrobi
  max_candidates: 5            # ile nowych spółek maksymalnie zaproponować dziennie
  run_full_analysis_on_candidates: true   # czy od razu przepuścić kandydatów przez pełną analizę tech.+newsową
  cooldown_days: 14            # przez ile dni nie proponować ponownie tej samej spółki po odkryciu

# -------------------------------------------------------------
# Dashboard webowy (src/web_app.py)
# -------------------------------------------------------------
web:
  host: "127.0.0.1"
  port: 8000
  refresh_interval_minutes: 60     # co ile minut serwer sam odświeża analizę w tle
  run_analysis_on_startup: true    # czy uruchomić pierwszy cykl analizy zaraz po starcie serwera
  manual_refresh_cooldown_seconds: 45   # min. odstęp między ręcznymi odświeżeniami TEJ SAMEJ spółki (chroni yfinance/Finnhub)
  price_alert_interval_seconds: 180     # co ile sekund sprawdzać TYLKO ceny pozycji portfela (0 = wyłączone)

# -------------------------------------------------------------
# Powiadomienia zewnętrzne o alertach cenowych (stop-loss/cel) - Discord.
# Uzupełnienie dashboardu, nie zamiennik: alert nadal trafia do logu na
# żywo i na WebSocket, niezależnie od tego ustawienia. Wyłączone domyślnie.
# -------------------------------------------------------------
notifications:
  enabled: false
  # Ustawienia serwera Discord -> Integracje -> Webhooki -> Nowy webhook -> kopiuj URL.
  # Nie wymaga bota ani logowania z poziomu tej aplikacji.
  discord_webhook_url: ""

# -------------------------------------------------------------
# Portfel - waluta bazowa do widoku łącznego (sumowanie wszystkich walut)
# -------------------------------------------------------------
portfolio:
  base_currency: "PLN"   # w tej walucie liczony jest łączny wykres/podsumowanie portfela
  benchmark: null           # opcjonalnie: ticker benchmarku do porównania z portfelem (np. "SPY", "QQQ", "^WIG20");
                            # domyślnie wybierany wg dominującej waluty portfela z technical.benchmark_by_currency
  risk_free_rate_pct: 0.0   # stopa wolna od ryzyka (% rocznie) używana we współczynniku Sharpe'a w panelu "Korelacja i zmienność"

# -------------------------------------------------------------
# Panel skuteczności narzędzia (na podstawie historii werdyktów)
# -------------------------------------------------------------
effectiveness:
  min_signal_age_days: 14   # ile dni musi minąć od werdyktu, żeby wliczyć go do statystyk
